<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSSReset.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">

    <title>Frontend Mentor | Time tracking dashboard</title>

</head>
<body>
<div id="container">

    <section id="profile"> <!--information about person-->

        <div>
            <div id="profilePicture">
                <img src="./images/image-jeremy.png">
            </div>
            <p class="grayText">
                Report for
            </p>
            <div id="name">
                Jeremy Robson
            </div>
        </div>

        <div class="grayText"> <!-- type of time-->
            <p>Daily</p>
            <p>Weekly</p>
            <p>Monthly</p>
        </div>

    </section>
    <section id="activities"> <!-- activities and time of them-->

        <div class="card work">
            <header class="icon">
<!--                <img src="./images/icon-work.svg">-->
            </header>
            <div>
                <div>
                    <span>Work</span>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
                <p class="activitiesTime">32hrs</p>
                <p class="grayText">Last week - <span>36hrs</span></p>
            </div>
        </div>

        <div class="card play">
            <header class="icon">
<!--                <img src="./images/icon-play.svg">-->
            </header>
            <div>
                <div>
                    <span>Play</span>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
                <p>10hrs</p>
                <p class="grayText">Last week - <span>8hrs</span></p>
            </div>
        </div>

        <div class="card study">
            <header class="icon">
<!--                <img src="./images/icon-study.svg">-->
            </header>
            <div>
                <div>
                    <span>Study</span>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
                <p class="activitiesTime">4hrs</p>
                <p class="grayText">Last week - <span>7hrs</span></p>
            </div>
        </div>

        <div class="card exercise">
            <header class="icon">
<!--                <img src="./images/icon-exercise.svg">-->
            </header>
            <div>
                <div>
                    <span>Exercise</span>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
                <p class="activitiesTime">4hrs</p>
                <p class="grayText">Last week - <span>5hrs</span></p>
            </div>
        </div>

        <div class="card social">
            <header class="icon">
<!--                <img src="./images/icon-social.svg">-->
            </header>
            <div>
                <div>
                    <span>Social</span>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
                <p class="activitiesTime">5hrs</p>
                <p class="grayText">Last week - <span>10hrs</span></p>
            </div>
        </div>

        <div class="card selfCare">
            <header class="icon">
<!--                <img src="./images/icon-self-care.svg">-->
            </header>
            <div>
                <div>
                    <span>Self care</span>
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
                <p class="activitiesTime">2hrs</p>
                <p class="grayText">Last week - <span>2hrs</span></p>
            </div>
        </div>

    </section>

    <div>

    </div>

</div>

</body>
</html>
